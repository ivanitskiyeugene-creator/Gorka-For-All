name: Build Khaki_A from TEST
on:
  workflow_dispatch:
  push:
    branches:
      - arena/fff81d6f-gorka-for-all
    paths:
      - .github/workflows/build-from-test.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/fff81d6f-gorka-for-all
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pillow numpy ispc_texcomp texture2ddecoder cityhash blake3 kraken-decompressor || true
          ls tools/ | head -20
      - name: Download TEST
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download TEST --pattern "Gorka3_For_All_Gloves_Texture_Test.zip" --dir /tmp --clobber
          ls -lh /tmp/*.zip
          sha256sum /tmp/*.zip
          mkdir -p google_drive
          cp /tmp/Gorka3_For_All_Gloves_Texture_Test.zip google_drive/
          unzip -l google_drive/Gorka3_For_All_Gloves_Texture_Test.zip | head -20
      - name: Extract and build
        run: |
          mkdir -p work/gorka-source
          unzip -p google_drive/Gorka3_For_All_Gloves_Texture_Test.zip Gorka3_For_All_P.utoc > work/gorka-source/Gorka3_For_All_P.utoc
          unzip -p google_drive/Gorka3_For_All_Gloves_Texture_Test.zip Gorka3_For_All_P.ucas > work/gorka-source/Gorka3_For_All_P.ucas
          unzip -p google_drive/Gorka3_For_All_Gloves_Texture_Test.zip build-manifest.json > work/gorka-source/build-manifest.json
          cat work/gorka-source/build-manifest.json | head -40
          mkdir -p work/gorka-source/full
          python tools/iostore_extract.py work/gorka-source/Gorka3_For_All_P.utoc --ucas work/gorka-source/Gorka3_For_All_P.ucas --output work/gorka-source/full --manifest work/gorka-source/extract.json
          ls -R work/gorka-source/full | head -100
          PYTHONPATH=. python tools/recolor_gorka_variants.py
          ls -lh release/*.zip || true
          if [ -f release/Gorka3_For_All_Brown_A.zip ]; then cp release/Gorka3_For_All_Brown_A.zip release/Gorka3_For_All_Khaki_A.zip; fi
          ls -lh release/ && sha256sum release/Gorka3_For_All_Khaki_A.zip || true
      - name: Commit built
        run: |
          git config user.name "arena-bot"; git config user.email "arena@local"
          git add -f release/Gorka3_For_All_Khaki_A.zip || true
          git add -f release/gorka-brown/*.zip 2>&1 | head -5 || true
          git status --porcelain | head -20
          git commit -m "build Khaki_A from TEST preserve sizes fix inline" || echo "no change"
          git push origin arena/fff81d6f-gorka-for-all || echo "push failed"
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: khaki-a-v1
          name: Gorka For All - Khaki_A v1
          body: "Khaki_A from TEST — верх #634F3C, штаны #806546, перчатки #323831. Фикс 12742x85 (header+cooked+serial), размеры сохранены."
          files: release/Gorka3_For_All_Khaki_A.zip
          token: ${{ secrets.GITHUB_TOKEN }}
