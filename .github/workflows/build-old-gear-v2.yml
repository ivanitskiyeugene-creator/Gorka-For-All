name: Build Old Gear v2
on:
  push:
    branches:
      - arena/fff81d6f-gorka-for-all
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt; pip install pillow numpy blake3 cityhash kraken-decompressor || true
      - name: Download old-assets rar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download old-assets-debug --pattern "gorka-assets.rar" --dir /tmp --clobber
          ls -lh /tmp/*.rar
          mkdir -p /tmp/old-assets
          sudo apt-get update && sudo apt-get install -y unrar
          unrar x /tmp/gorka-assets.rar /tmp/old-assets/ || 7z x /tmp/gorka-assets.rar -o/tmp/old-assets
          find /tmp/old-assets -type f | wc -l
      - name: Build OldPouch+Knife+Detector mod
        run: |
          mkdir -p release/old-gear
          {
            echo "=== DIAG HEAD=$(git rev-parse HEAD) ==="
            head -5 tools/build_old_gear_proper.py || head -5 tools/build_old_gear.py
            python -c "import tools.build_gorka_mod; print('import ok')" 2>&1 || echo "import check failed"
            echo "=== BUILD START (proper patched) ==="
            python tools/build_old_gear_proper.py --source /tmp/old-assets --output release/old-gear --verbose 2>&1 || echo "builder exit $?"
            echo "=== BUILD END ==="
            ls -lh release/old-gear/ 2>&1
            ls -lh release/*.zip 2>&1 | head -20
          } 2>&1 | tee /tmp/build.log
          cp /tmp/build.log release/old-gear/build.log || true
      - name: Upload OldGear artifacts to release (no git commit needed)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "=== UPLOAD DIAG ==="
            ls -lh release/old-gear/ 2>&1 | head -20
            ls -lh release/OldGear_Pouch_Knife_Detector.zip 2>&1 | head -5 || echo "no zip"
            echo "release assets before:"
            gh release view old-gear-mod --json assets --jq '.assets[].name' 2>&1 | head -10 || true
            if [ -f release/OldGear_Pouch_Knife_Detector.zip ]; then
              echo "uploading zip to old-gear-mod..."
              gh release upload old-gear-mod release/OldGear_Pouch_Knife_Detector.zip --clobber 2>&1 | head -40 || echo "upload zip failed"
              echo "upload exit code $?"
              ls -lh release/OldGear_Pouch_Knife_Detector.zip
            else
              echo "ZIP not found — build failed"
            fi
            echo "release assets after:"
            gh release view old-gear-mod --json assets --jq '.assets[] | "\(.name) \(.size)"' 2>&1 | head -10 || true
          } 2>&1 | tee /tmp/upload.log
          cp /tmp/upload.log release/old-gear/upload.log 2>&1 || true
          cat /tmp/upload.log | tail -20
      - name: Commit logs to branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "arena-bot"; git config user.email "arena@local"
          cp /tmp/build.log release/old-gear/build.log 2>&1 || true
          cp /tmp/upload.log release/old-gear/upload.log 2>&1 || true
          git add -f release/old-gear/build.log release/old-gear/upload.log 2>&1 | head -10 || true
          git commit -m "update build log" || echo "no log change"
          git push origin arena/fff81d6f-gorka-for-all 2>&1 | head -10 || echo "push log failed"
      - name: Build Old Vest
        if: always()
        run: |
          mkdir -p release/old-vest
          {
            python tools/build_old_gear.py --source /tmp/old-assets --variant vest_old --output release/old-vest --verbose 2>&1 || true
            ls -lh release/old-vest/ 2>&1
          } 2>&1 | tee /tmp/build-vest.log
          cp /tmp/build-vest.log release/old-vest/build-vest.log || true
      - name: Commit Old Vest
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "arena-bot"; git config user.email "arena@local"
          if [ -f release/OldVest_P.zip ]; then
            gh release upload old-gear-mod release/OldVest_P.zip --clobber 2>&1 | head -10 || true
          fi
          git add -f release/old-vest/build-vest.log 2>&1 | head -10 || true
          git commit -m "build OldVest_P from old-assets-debug" || echo "no change"
          git push origin arena/fff81d6f-gorka-for-all 2>&1 | head -10 || echo "push failed"
# trigger upload after delete
